<div class="announce" role="region" aria-label="Erbjudanden">

<header class="site-header" id="site-header">

    <a class="logo" href="#/" aria-label="Sundla – till startsidan">
      <svg class="logo__mark" viewBox="0 0 32 32" aria-hidden="true"><g transform="rotate(-35 16 16)"><rect x="3" y="10" width="26" height="12" rx="6" fill="var(--brand)"/><path d="M16 10H23A6 6 0 0 1 23 22H16Z" fill="var(--accent)"/></g></svg>
      <span class="logo__word">sundla</span>
    </a>
    <form class="search" id="search-form" role="search" autocomplete="off">
      <label class="visually-hidden" for="search-input">Sök bland produkter</label>
      <svg class="ico search__ico"><use href="#i-search"/></svg>
      <input id="search-input" type="search" placeholder="Sök D-vitamin, magnesium, kreatin…" aria-autocomplete="list" aria-controls="search-suggest" aria-expanded="false">
      <div class="search__suggest" id="search-suggest" role="listbox" hidden></div>
    </form>
    <nav class="header__tools" aria-label="Konto och varukorg">
      <button class="icon-btn" type="button" id="theme-toggle" aria-label="Byt till mörkt tema"><svg class="ico"><use href="#i-moon"/></svg></button>

    </nav>
  </div>
  <nav class="catnav" aria-label="Kategorier">
    <ul class="catnav__list container" id="catnav"></ul>
  </nav>
</header>

</aside>
